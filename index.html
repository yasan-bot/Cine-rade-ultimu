<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cine râde ultimul">
<meta name="theme-color" content="#0B0809">
<meta name="description" content="Joc de petrecere: două echipe, premise amuzante și râsete numărate.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Cine râde ultimul</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0B0809;
    --surface: #161013;
    --surface-2: #221719;
    --line: #3A1D24;
    --red: #C4172A;
    --red-hover: #D91E33;
    --red-bright: #FF5566;
    --cherry: #6E0F1E;
    --ivory: #F5EAE6;
    --muted: #B9A6A8;
    --bg-text: #F5EAE6;
    --bg-muted: #B9A6A8;
    --text: #F5EAE6;
    --bw: 1px;
    --input-bg: #0B0809;
    --premise-bg: #6E0F1E;
    --premise-text: #F5EAE6;
    --error: #FF5566;
    --panel-shadow: none;
    --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
    color-scheme: dark;
  }

  body[data-bg="spicy"] {
    --bg-text: #FFF4EC; --bg-muted: #FFE2D2; --text: #FFF4EC; --muted: #F3C9B5;
    --surface: #2B0B06; --surface-2: #4A1608; --line: #FF8A1F; --bw: 2px;
    --input-bg: #1E0703; --premise-bg: #5C1305; --premise-text: #FFF4EC; --error: #FFD0A0;
  }
  body[data-bg="kids"] {
    --bg-text: #1D1B1A; --bg-muted: #3A2E00; --text: #1D1B1A; --muted: #4A3B0C;
    --surface: #FFFDF2; --surface-2: #FFE98A; --line: #1D1B1A; --bw: 3px;
    --input-bg: #FFFFFF; --premise-bg: #FFFDF2; --premise-text: #1D1B1A; --error: #B3200A;
    --red: #E8402A; --panel-shadow: 5px 5px 0 #1D1B1A;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--black); color: var(--text); font: 400 18px/1.5 var(--body); }

  /* Full-screen background, sits behind all content */
  #bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .bg-normal, .bg-intro { background: radial-gradient(circle at 20% 10%, #8A1424 0%, #3B0710 70%); }
  .bg-spicy { background: linear-gradient(160deg, #A8120F 0%, #E2401C 55%, #FF8A1F 100%); }
  .bg-kids { background: #FFD43B; }

  .sticker {
    position: absolute;
    display: block;
    border-radius: 16px;
    box-shadow: 0 8px 18px rgba(0, 0, 0, .4);
  }
  .chili { position: absolute; width: 60px; }
  .chili svg { display: block; width: 100%; height: auto; }
  .ghost-sticker { position: absolute; display: block; pointer-events: none; }
  .flames-bottom { position: absolute; left: 0; bottom: 0; width: 100%; height: 34vh; }
  .doodle { position: absolute; line-height: 0; opacity: .55; pointer-events: none; }
  .doodle svg { display: block; width: 100%; height: auto; }

  .app {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100%;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(32px + env(safe-area-inset-bottom, 0px));
  }

  h1, h2, h3 { font-family: var(--display); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; margin: 0; }
  h1 { font-size: 46px; }
  h2 { font-size: 30px; }
  h3 { font-size: 19px; margin-bottom: 8px; }
  p { margin: 0; }

  button, input, select { font: inherit; color: inherit; }
  button {
    border: 0;
    border-radius: 16px;
    padding: 16px 18px;
    cursor: pointer;
    transition: transform .12s ease, background-color .2s ease, opacity .2s ease;
  }
  button:active:not(:disabled) { transform: scale(.98); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--ivory); outline-offset: 3px; }

  .primary {
    display: block;
    width: 100%;
    margin-top: 18px;
    background: var(--red);
    color: var(--ivory);
    font-family: var(--display);
    font-weight: 800;
    font-size: 21px;
    letter-spacing: -0.01em;
  }
  .primary:not(:disabled):hover { background: var(--red-hover); }
  .secondary {
    display: block;
    width: 100%;
    margin-top: 12px;
    background: transparent;
    color: var(--text);
    border: var(--bw) solid var(--line);
    font-weight: 700;
  }
  .ghost {
    display: block;
    width: 100%;
    margin-top: 10px;
    background: transparent;
    color: var(--muted);
    font-weight: 700;
    padding: 12px;
  }

  .screen.in, .panel.in, .wiz-card.in { animation: screenIn .45s cubic-bezier(.2, .8, .2, 1); }
  @keyframes screenIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes pop {
    0% { opacity: 0; transform: scale(.4); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes bump { 40% { transform: scale(1.14); } }

  /* Intro */
  #s-intro { text-align: center; padding-top: 12px; }
  #lang {
    position: fixed;
    right: calc(16px + env(safe-area-inset-right, 0px));
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    z-index: 2;
    display: inline-flex;
    gap: 8px;
    padding: 6px;
    background: var(--surface);
    border: var(--bw) solid var(--line);
    border-radius: 999px;
  }
  #lang[hidden] { display: none !important; }
  .lang-btn {
    padding: 0;
    background: transparent;
    border-radius: 6px;
    line-height: 0;
    opacity: .45;
  }
  .lang-btn[aria-pressed="true"] { opacity: 1; outline: 2px solid var(--ivory); outline-offset: 2px; }
  .lang-btn svg { display: block; width: 36px; height: 24px; border-radius: 3px; }
  .title {
    font-family: var(--display);
    font-weight: 800;
    font-size: min(44px, 8vw);
    line-height: .98;
    white-space: nowrap;
    letter-spacing: -0.03em;
    margin-top: 34px;
  }
  .letter {
    display: inline-block;
    white-space: pre;
    animation: letterIn .7s cubic-bezier(.2, .9, .3, 1.25) both;
    animation-delay: calc(var(--i) * 45ms + 120ms);
  }
  @keyframes letterIn {
    from { opacity: 0; transform: translateY(.5em) rotate(10deg); }
    to { opacity: 1; transform: none; }
  }
  .lede { margin-top: 14px; color: var(--ivory); font-size: 19px; }

  .start-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: min(300px, 86%);
    height: 96px;
    margin-top: 52px;
    padding: 0 36px;
    border-radius: 999px;
    background: var(--red);
    color: var(--ivory);
    font-family: var(--display);
    font-weight: 800;
    font-size: 42px;
    letter-spacing: -0.02em;
    animation: giggle 1.1s ease-in-out infinite, glow 2.2s ease-out infinite;
  }
  .start-btn:hover { background: var(--red-hover); }
  @keyframes giggle {
    0%, 100% { transform: rotate(0); }
    15% { transform: rotate(-3deg) scale(1.02); }
    30% { transform: rotate(3deg); }
    45% { transform: rotate(-2deg); }
    60% { transform: rotate(2deg); }
    75% { transform: rotate(0); }
  }
  @keyframes glow {
    0% { box-shadow: 0 0 0 0 rgba(196, 23, 42, .55); }
    70%, 100% { box-shadow: 0 0 0 22px rgba(196, 23, 42, 0); }
  }
  .hint-line { margin-top: 26px; color: var(--ivory); font-size: 15px; }

  /* Categories */
  .cats { display: grid; gap: 12px; margin-top: 22px; text-align: left; }
  .cat {
    display: grid;
    gap: 4px;
    min-height: 120px;
    padding: 20px;
    border-radius: 22px;
    color: var(--ivory);
    text-align: left;
  }
  .cat .cat-name { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.05; }
  .cat .cat-desc { font-size: 16px; }
  .cat:hover { filter: brightness(1.08); }
  .cat.bg-kids { color: #1D1B1A; }

  /* Wizard */
  .progress { display: grid; gap: 8px; color: var(--bg-muted); font-weight: 700; font-size: 15px; }
  .steps { display: flex; gap: 6px; }
  .steps i { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-2); }
  .steps i.done { background: var(--red); }
  .steps i.now { background: var(--text); }

  .wiz-card {
    margin-top: 20px;
    background: var(--surface);
    border: var(--bw) solid var(--line);
    border-radius: 24px;
    padding: 24px 20px;
    text-align: left;
  }
  .wiz-form { display: grid; gap: 14px; margin-top: 18px; }
  .wiz-form .primary { margin-top: 0; }
  input, select {
    width: 100%;
    padding: 14px 16px;
    background: var(--input-bg);
    border: var(--bw) solid var(--line);
    border-radius: 14px;
    font-size: 18px;
  }
  .hint { margin-top: 8px; color: var(--muted); font-size: 15px; }
  .counter { margin-top: 12px; color: var(--muted); font-weight: 700; font-size: 15px; }
  .error { min-height: 1.5em; margin-top: 8px; color: var(--error); font-weight: 700; }
  .limit { margin-top: 10px; color: var(--text); font-weight: 700; }

  .players { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; min-height: 44px; }
  .player-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 8px 8px 14px;
    background: var(--surface-2);
    border: var(--bw) solid var(--line);
    border-radius: 999px;
    font-weight: 700;
  }
  .player-chip.pop { animation: pop .45s cubic-bezier(.2, 1.6, .4, 1); }
  .chip-x {
    padding: 2px 10px;
    border-radius: 999px;
    background: var(--black);
    color: var(--ivory);
    font-size: 16px;
    line-height: 1.3;
  }
  .summary-grid { display: grid; gap: 12px; margin-top: 18px; }
  .summary-team { background: var(--surface-2); border-radius: 16px; padding: 14px; }
  .settings { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
  label { display: grid; gap: 6px; font-weight: 700; font-size: 15px; }

  /* Round and turns */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-top: 4px;
    color: var(--bg-muted);
    font-weight: 700;
  }
  .topbar strong { font-family: var(--display); font-weight: 800; font-size: 20px; color: var(--bg-text); }

  .premise {
    position: relative;
    margin-top: 14px;
    min-height: 210px;
    padding: 32px 24px;
    border-radius: 24px;
    background: var(--premise-bg);
    border: var(--bw) solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .premise p {
    max-width: 100%;
    padding: 16px 18px;
    background: transparent;
    color: var(--premise-text);
    border-radius: 18px;
    font-family: var(--display);
    font-weight: 800;
    font-size: 30px;
    line-height: 1.12;
    letter-spacing: -0.01em;
    text-align: center;
    text-wrap: balance;
  }
  .premise.enter { animation: rise .5s cubic-bezier(.2, .8, .2, 1); }
  @keyframes rise {
    from { opacity: 0; transform: translateY(12px) scale(.98); }
    to { opacity: 1; transform: none; }
  }
  .round-hint { margin-top: 18px; color: var(--bg-muted); text-align: center; }

  .mini-premise {
    margin-top: 14px;
    padding: 14px;
    border-radius: 18px;
    background: var(--premise-bg);
    border: var(--bw) solid var(--line);
    text-align: center;
  }
  .mini-premise p {
    display: inline-block;
    padding: 8px 12px;
    background: transparent;
    color: var(--premise-text);
    border-radius: 12px;
    font-family: var(--display);
    font-weight: 800;
    font-size: 19px;
    line-height: 1.2;
  }

  .turn-panel {
    margin-top: 18px;
    display: grid;
    gap: 12px;
    text-align: center;
    justify-items: center;
  }
  .turn-panel > * { width: 100%; }
  .turn-panel .primary { margin-top: 8px; }
  .tag {
    width: auto !important;
    justify-self: center;
    padding: 6px 14px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 15px;
  }
  .tag.a { background: var(--red); color: var(--ivory); }
  .tag.b { background: var(--ivory); color: var(--black); }
  .turn-name {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(40px, 12vw, 56px);
    line-height: 1;
    letter-spacing: -0.02em;
    overflow-wrap: anywhere;
    color: var(--bg-text);
  }
  .reaction-title { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.1; color: var(--bg-text); }
  .audience { color: var(--bg-muted); font-size: 17px; }

  .meter {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-top: 6px;
  }
  .ring-wrap { position: relative; width: 84px; height: 84px; flex: none; margin: 0 auto; }
  .ring { width: 100%; height: 100%; display: block; }
  .ring-track, .ring-fill { fill: none; stroke-width: 6; }
  .ring-track { stroke: var(--surface-2); }
  .ring-fill { stroke: var(--red); stroke-linecap: round; transition: stroke-dashoffset .15s linear; }
  .timer-num {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--display);
    font-weight: 800;
    font-size: 26px;
    font-variant-numeric: tabular-nums;
  }
  .meter-count { display: grid; justify-items: start; }
  .meter-count.center { justify-items: center; }
  .slot-count {
    font-family: var(--display);
    font-weight: 800;
    font-size: 64px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .slot-count.bump { animation: bump .3s ease; }
  .caption { font-size: 14px; color: var(--muted); }

  .laugh-big {
    width: 100%;
    margin-top: 6px;
    padding: 26px 16px;
    background: var(--red);
    color: var(--ivory);
    font-family: var(--display);
    font-weight: 800;
    font-size: 30px;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row2 .secondary { margin-top: 0; }
  .keys { margin-top: 16px; font-size: 14px; color: var(--bg-muted); text-align: center; }

  /* Results and podium */
  .res-premise { margin-top: 12px; color: var(--bg-muted); font-size: 17px; }
  .scores { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
  .score-box {
    padding: 18px 12px;
    text-align: center;
    background: var(--surface);
    border: var(--bw) solid var(--line);
    border-radius: 22px;
  }
  .score-box .slot-count { font-size: 60px; margin: 8px auto 0; }
  .score-name { font-family: var(--display); font-weight: 800; font-size: 17px; line-height: 1.15; }
  .verdict { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1.12; margin-top: 24px; color: var(--bg-text); }
  .summary { margin-top: 8px; color: var(--bg-muted); font-weight: 700; }

  .sub { margin-top: 10px; color: var(--bg-muted); font-weight: 700; }
  .stage { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin-top: 26px; }
  .step { flex: 1; max-width: 150px; text-align: center; color: var(--bg-text); }
  .step-name { font-family: var(--display); font-weight: 800; font-size: 18px; line-height: 1.12; overflow-wrap: anywhere; }
  .step-team { font-size: 14px; color: var(--bg-muted); margin-top: 4px; }
  .step-score { font-weight: 700; margin: 8px 0; }
  .block {
    display: flex;
    justify-content: center;
    padding-top: 10px;
    font-family: var(--display);
    font-weight: 800;
    font-size: 48px;
    line-height: 1;
    border-radius: 16px 16px 0 0;
    background: var(--surface-2);
    border: var(--bw) solid var(--line);
    border-bottom: none;
  }
  .block.r1 { background: var(--red); color: var(--ivory); border-color: var(--red); }
  .block.r2 { background: var(--cherry); color: var(--ivory); border-color: var(--cherry); }

  .section-title { font-family: var(--display); font-weight: 800; font-size: 24px; margin-top: 30px; color: var(--bg-text); }
  .roster { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 10px; }
  .roster li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--surface);
    border: var(--bw) solid var(--line);
    border-radius: 14px;
  }
  .roster strong { font-family: var(--display); font-weight: 800; font-size: 17px; }
  .roster-score { font-weight: 700; white-space: nowrap; }

  .premise { flex-direction: column; gap: 14px; }
  .premise-icons { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 8px; }
  .premise-icon { display: block; line-height: 0; }
  .premise-icons .chili-icon svg { width: 36px; height: auto; display: block; }
  .premise-icons .flames-bottom { position: relative; left: auto; bottom: auto; width: 150px; height: 40px; }
  .premise-icons .logo-icon { width: 120px; height: auto; opacity: .3; }
  .premise-icons .doodle-icon { width: 72px; opacity: .55; }
  .premise-icons .doodle-icon svg { display: block; width: 100%; height: auto; }
  #mode {
    position: fixed;
    left: calc(16px + env(safe-area-inset-left, 0px));
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    z-index: 2;
    display: inline-flex;
    gap: 6px;
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
  }
  #mode[hidden] { display: none !important; }
  .mode-btn { padding: 10px 14px; background: transparent; color: var(--ivory); border-radius: 999px; font-weight: 700; font-size: 15px; }
  .mode-btn[aria-pressed="true"] { background: var(--ivory); color: var(--black); }


  .wiz-card, .team, .score-box, .premise, .mini-premise, .roster li { box-shadow: var(--panel-shadow); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div id="lang" class="lang" role="group" aria-label="Limba">
  <button type="button" class="lang-btn" data-lang="ro" aria-label="Română" aria-pressed="true"><svg viewBox="0 0 3 2" preserveAspectRatio="none" aria-hidden="true"><rect width="1" height="2" fill="#002B7F"/><rect x="1" width="1" height="2" fill="#FCD116"/><rect x="2" width="1" height="2" fill="#CE1126"/></svg></button>
  <button type="button" class="lang-btn" data-lang="en" aria-label="English (UK)" aria-pressed="false"><svg viewBox="0 0 60 30" preserveAspectRatio="none" aria-hidden="true"><clipPath id="uk-s"><path d="M0,0 v30 h60 v-30 z"/></clipPath><clipPath id="uk-t"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><g clip-path="url(#uk-s)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#uk-t)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></svg></button>
</div>
<div id="mode" class="mode-switch" role="group" aria-label="Mod">
  <button type="button" class="mode-btn" data-mode="rounds" data-i18n="modeTurns" aria-pressed="true"></button>
  <button type="button" class="mode-btn" data-mode="free" data-i18n="modeFree" aria-pressed="false"></button>
</div>
<main class="app">

  <section id="s-intro" class="screen">
    <h1 id="title" class="title"></h1>
    <p class="lede" data-i18n="lede"></p>
    <button id="btn-start" type="button" class="start-btn" data-i18n="start"></button>
    <p class="hint-line" data-i18n="introHint"></p>
  </section>

  <section id="s-category" class="screen" hidden>
    <h2 data-i18n="catTitle"></h2>
    <div class="cats">
      <button type="button" class="cat bg-spicy" data-cat="spicy">
        <span class="cat-name" data-i18n="catSpicy"></span>
      </button>
      <button type="button" class="cat bg-normal" data-cat="normal">
        <span class="cat-name" data-i18n="catNormal"></span>
      </button>

  <section id="s-setup" class="screen" hidden>

    <div id="wiz-card" class="wiz-card"></div>

  <section id="s-round" class="screen" hidden>
    <div class="topbar">
      <span id="round-label"></span>
      <strong id="score-line"></strong>
    </div>
    <div id="premise-card" class="premise">
      <div id="premise-icons" class="premise-icons"></div>
      <p id="premise"></p>
    </div>
    <p id="round-hint" class="round-hint" data-i18n="roundHint"></p>
    <button id="btn-round-start" type="button" class="primary" data-i18n="startRound"></button>
  </section>

  <section id="s-turn" class="screen" hidden>
    <div class="topbar">
      <span id="turn-label"></span>
      <strong id="turn-count"></strong>
    </div>
    <div id="mini-premise" class="mini-premise"><p id="mini-text"></p></div>

    <div id="turn-ready" class="panel turn-panel">
      <span id="ready-team" class="tag"></span>
      <p id="ready-name" class="turn-name"></p>
      <p id="ready-audience" class="audience"></p>
      <button id="btn-slot-start" type="button" class="primary"></button>
    </div>

    <div id="turn-joke" class="panel turn-panel" hidden>
      <span id="joke-team" class="tag"></span>
      <p id="joke-name" class="turn-name"></p>
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 76 76" aria-hidden="true">
          <g transform="rotate(-90 38 38)">
            <circle class="ring-track" cx="38" cy="38" r="32"></circle>
            <circle id="joke-fill" class="ring-fill" cx="38" cy="38" r="32"></circle>
          </g>
        </svg>
        <span id="joke-num" class="timer-num">15</span>
      </div>
      <p id="joke-note" class="audience"></p>
      <button id="btn-joke-end" type="button" class="primary"></button>
    </div>

    <div id="turn-reaction" class="panel turn-panel" hidden>
      <span id="react-team" class="tag"></span>
      <p id="react-title" class="reaction-title"></p>
      <div class="meter">
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 76 76" aria-hidden="true">
            <g transform="rotate(-90 38 38)">
              <circle class="ring-track" cx="38" cy="38" r="32"></circle>
              <circle id="react-fill" class="ring-fill" cx="38" cy="38" r="32"></circle>
            </g>
          </svg>
          <span id="react-num" class="timer-num">6</span>
        </div>
        <div class="meter-count">
          <span id="react-count" class="slot-count">0</span>
          <span id="react-caption" class="caption"></span>
        </div>
      </div>
      <p id="react-mode" class="audience"></p>
      <button id="btn-laugh" type="button" class="laugh-big"></button>
      <div class="row2">
        <button id="btn-undo" type="button" class="secondary"></button>
        <button id="btn-react-end" type="button" class="secondary"></button>
      </div>
    </div>

    <div id="turn-done" class="panel turn-panel" hidden>
      <span id="done-team" class="tag"></span>
      <p id="done-name" class="turn-name"></p>
      <div class="meter-count center">
        <span id="done-count" class="slot-count">0</span>
        <span id="done-caption" class="caption"></span>
      </div>
      <p id="done-note" class="audience"></p>
      <button id="btn-slot-next" type="button" class="primary"></button>
    </div>

    <p class="keys" data-i18n="keys"></p>
  </section>

  <section id="s-results" class="screen" hidden>

    <p id="verdict" class="verdict"></p>
    <p id="res-summary" class="summary"></p>
    <button id="btn-next" type="button" class="primary"></button>
  </section>

  <section id="s-podium" class="screen" hidden>

    <ul id="roster" class="roster"></ul>
    <button id="btn-new" type="button" class="primary" data-i18n="newGame"></button>
  </section>

  /* ---------- Laugh detection from the microphone ---------- */

  // Heuristic detector (no model): counts short loud bursts in the speech band during the reaction window.
  // Claps are too short to count, and the performer is silent during this window.
  const mic = {
    ok: false,
    stream: null,
    ctx: null,
    analyser: null,
    bins: null,
    binHz: 1,
    floor: -60,
    active: false,
    burstStart: 0,
    lastCount: 0,
  };

  async function initMic() {
    try {
      mic.stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
      });
      const Ctx = window.AudioContext || window.webkitAudioContext;
      mic.ctx = new Ctx();
      mic.ctx.resume().catch(() => {});
      const source = mic.ctx.createMediaStreamSource(mic.stream);
      mic.analyser = mic.ctx.createAnalyser();
      mic.analyser.fftSize = 1024;
      source.connect(mic.analyser);
      mic.bins = new Float32Array(mic.analyser.frequencyBinCount);
      mic.binHz = mic.ctx.sampleRate / mic.analyser.fftSize;
      mic.ok = true;
    } catch (_) {
      mic.ok = false;
    }
  }

  function stopMic() {
    if (mic.stream) mic.stream.getTracks().forEach((track) => track.stop());
    if (mic.ctx) mic.ctx.close();
    mic.stream = null;
    mic.ctx = null;
    mic.analyser = null;
    mic.ok = false;
  }

  function bandLevelDb() {
    mic.analyser.getFloatFrequencyData(mic.bins);
    const lo = Math.max(1, Math.floor(400 / mic.binHz));
    const hi = Math.min(mic.bins.length - 1, Math.floor(3000 / mic.binHz));
    let sum = 0;
    for (let i = lo; i <= hi; i++) sum += Math.pow(10, mic.bins[i] / 10);
    return 10 * Math.log10(sum / (hi - lo + 1) + 1e-12);
  }

  function detectTick() {
    const level = bandLevelDb();
    if (!isFinite(level)) return;
    const now = Date.now();
    if (!mic.active) {
      mic.floor += (level - mic.floor) * 0.03;
      if (level > mic.floor + 10) {
        mic.active = true;
        mic.burstStart = now;
      }
    } else {
      const len = now - mic.burstStart;
      if (level < mic.floor + 6 || len > 5000) {
        mic.active = false;
        if (len >= 300 && len <= 5000 && now - mic.lastCount > 800) {
          mic.lastCount = now;
          addLaugh();
        }
      }
    }
  }

    const addForm = h("div", { class: "wiz-form" },
      input,
      h("button", { type: "button", class: "primary", onclick: addPlayer }, t("addPlayer"))
    );

    return h("div", {},
      h("h2", {}, t("playersOf", { team: teamLabel(i) })),
      h("p", { class: "hint" }, t("playersHint")),
      chips,
      h("p", { class: "counter" }, t("counter", { n: count })),
      full ? h("p", { class: "limit" }, t("limit")) : addForm,
      h("button", {
        type: "button",
        class: full ? "primary" : "secondary",
        disabled: count ? null : "",
        onclick: advance,
      }, t("teamDone")),
      backButton()
    );
  }

  function reviewStep() {
    const teamSummary = (i) => h("div", { class: "summary-team" },
      h("h3", {}, teamLabel(i)),
      h("div", { class: "players" }, wiz.teams[i].players.map((p) =>
        h("span", { class: "player-chip" }, p)
      ))
    );

    const rounds = h("select", { id: "set-rounds" },
      [2, 3, 5].map((n) => h("option", { value: n, selected: n === 3 ? "" : null }, t("roundsOpt", { n })))
    );
    const seconds = h("select", { id: "set-time" },
      [10, 15, 20, 30].map((n) => h("option", { value: n, selected: n === 15 ? "" : null }, t("timeOpt", { n })))
    );

    const ready = wiz.teams.every((team) => team.players.length > 0);

    return h("div", {},
      h("h2", {}, t("reviewTitle")),
      h("div", { class: "summary-grid" }, [0, 1].map(teamSummary)),
      h("div", { class: "settings" },
        h("label", {}, t(game.mode === "free" ? "premisesLabel" : "roundsLabel"), rounds),
        game.mode === "rounds" ? h("label", {}, t("timeLabel"), seconds) : null
      ),
      h("p", { class: "error" }, ready ? "" : t("needPlayers")),
      h("button", {
        type: "button",
        class: "primary",
        disabled: ready ? null : "",
        onclick: () => startGame(Number(rounds.value), Number(seconds.value)),
      }, t("startGame")),
      h("button", {
        type: "button",
        class: "ghost",
        onclick: () => { wiz.step = 0; renderWizard(); },
      }, t("editTeams"))
    );
  }

  /* ---------- Game ---------- */

  const REACTION_SECONDS = 6;
  const RING_C = 2 * Math.PI * 32;

  const game = {
    category: "normal",
    teams: [],
    totalRounds: 3,
    jokeSeconds: 15,
    round: 0,
    deck: [],
    premise: "",
    order: [],
    slotIndex: 0,
    slotResults: [],
    awarded: false,
    phase: null,
    slotLaughs: 0,
    phaseEnd: 0,
    phaseRemaining: 0,
    timer: null,
    mode: "rounds",
  };

  function makeTeam(name, players) {
    return {
      name,
      wins: 0,
      players: players.map((n) => ({ name: n, laughs: 0 })),
    };
  }

  function startGame(rounds, seconds) {
    game.totalRounds = rounds;
    game.jokeSeconds = seconds;
    game.teams = wiz.teams.map((team, i) => makeTeam(team.name || t(i ? "team1" : "team0"), team.players));
    game.round = 0;
    game.deck = [];
    stopMic();
    nextRound();
    if (game.mode === "rounds") initMic();
  }

  // Each round, every contestant performs once. Teams alternate, and the starting team changes each round.
  function buildOrder(round) {
    const first = (round - 1) % 2;
    const sequence = [first, 1 - first];
    const longest = Math.max(...game.teams.map((team) => team.players.length));
    const order = [];
    for (let i = 0; i < longest; i++) {
      for (const teamIdx of sequence) {
        if (i < game.teams[teamIdx].players.length) order.push({ team: teamIdx, player: i });
      }
    }
    return order;
  }

  // Premise-only mode: the next premise, with no counting and no score
  function nextFree() {
    if (game.round < game.totalRounds) nextRound();
    else {
      stopMic();
      show("s-intro");
    }
  }

  function renderPremiseIcons(cat) {
    const box = $("premise-icons");
    if (cat === "spicy") {
      const chilis = [-22, 18].map((deg) => {
        const node = h("span", { class: "premise-icon chili-icon", style: `transform:rotate(${deg}deg)` });
        node.innerHTML = CHILI_SVG;
        return node;
      });
      const flames = document.createElement("div");
      flames.innerHTML = FLAMES_SVG;
      box.replaceChildren(...chilis, flames.firstElementChild);
    } else if (cat === "normal") {
      box.replaceChildren(h("img", { class: "premise-icon logo-icon", src: LOGO_GHOST_SRC, alt: "" }));
    } else {
      box.replaceChildren(...KID_DOODLES.map((svg, i) => {
        const node = h("span", { class: "premise-icon doodle-icon", style: `transform:rotate(${i * 9 - 9}deg)` });
        node.innerHTML = svg;
        return node;
      }));
    }
  }

  function nextRound() {
    game.round += 1;
    game.awarded = false;
    game.slotResults = [];
    game.slotIndex = 0;
    game.order = buildOrder(game.round);

    if (!game.deck.length) game.deck = shuffle([...CATS[game.category][lang]]);
    game.premise = game.deck.pop();

    const card = $("premise-card");
    $("premise").textContent = game.premise;
    renderPremiseIcons(game.category);
    card.classList.remove("enter");
    void card.offsetWidth;
    card.classList.add("enter");

    $("round-label").textContent = t("roundOf", { n: game.round, m: game.totalRounds });
    $("score-line").textContent = `${game.teams[0].wins} – ${game.teams[1].wins}`;
    const free = game.mode === "free";
    $("round-label").parentElement.hidden = free;
    $("round-hint").hidden = free;
    $("round-hint").textContent = t("roundHint");
    $("btn-round-start").textContent = free
      ? t(game.round < game.totalRounds ? "nextPremise" : "newGame")
      : t("startRound");
    show("s-round");
  }

  function currentSlot() {
    return game.order[game.slotIndex];
  }

  function setTag(id, teamIdx, text) {
    $(id).textContent = text;
    $(id).className = "tag " + (teamIdx ? "b" : "a");
  }

  function renderRing(prefix, remaining, total) {
    const fill = $(prefix + "-fill");
    fill.style.strokeDasharray = `${RING_C} ${RING_C}`;
    fill.style.strokeDashoffset = `${RING_C * (1 - remaining / total)}`;
    $(prefix + "-num").textContent = Math.ceil(remaining / 1000);
  }

  function renderTurnTop() {
    const slot = currentSlot();
    $("turn-label").textContent = t("roundOf", { n: game.round, m: game.totalRounds });
    $("turn-count").textContent = t("jokeOf", { n: game.slotIndex + 1, m: game.order.length });
    $("mini-text").textContent = game.premise;
    return slot;
  }

  function showReady() {
    const slot = renderTurnTop();
    const team = game.teams[slot.team];
    const other = game.teams[1 - slot.team];
    setTag("ready-team", slot.team, team.name);
    $("ready-name").textContent = team.players[slot.player].name;
    $("ready-audience").textContent = t("audience", { team: other.name });
    $("btn-slot-start").textContent = t("startJoke");
    if ($("s-turn").hidden) show("s-turn");
    panel("turn-ready");
  }

  function startJoke() {
    game.phase = "joke";
    game.phaseRemaining = game.jokeSeconds * 1000;
    game.phaseEnd = Date.now() + game.phaseRemaining;
    clearInterval(game.timer);
    game.timer = setInterval(jokeTick, 100);
    renderJoke();
    panel("turn-joke");
  }

  function jokeTick() {
    game.phaseRemaining = Math.max(0, game.phaseEnd - Date.now());
    if (game.phaseRemaining === 0) startReaction();
    else renderRing("joke", game.phaseRemaining, game.jokeSeconds * 1000);
  }

  function renderJoke() {
    const slot = renderTurnTop();
    const team = game.teams[slot.team];
    setTag("joke-team", slot.team, team.name);
    $("joke-name").textContent = team.players[slot.player].name;
    $("joke-note").textContent = t("jokeRunning");
    $("btn-joke-end").textContent = t("endJoke");
    renderRing("joke", game.phaseRemaining, game.jokeSeconds * 1000);
  }

  function startReaction() {
    clearInterval(game.timer);
    game.phase = "reaction";
    game.slotLaughs = 0;
    game.phaseRemaining = REACTION_SECONDS * 1000;
    game.phaseEnd = Date.now() + game.phaseRemaining;
    if (mic.ok) {
      const start = bandLevelDb();
      mic.floor = isFinite(start) ? start : -70;
    }
    mic.active = false;
    mic.lastCount = 0;
    game.timer = setInterval(reactionTick, 50);
    renderReaction();
    panel("turn-reaction");
  }

  function reactionTick() {
    game.phaseRemaining = Math.max(0, game.phaseEnd - Date.now());
    if (mic.ok) detectTick();
    if (game.phaseRemaining === 0) endSlot();
    else renderRing("react", game.phaseRemaining, REACTION_SECONDS * 1000);
  }

  function renderReaction() {
    const slot = renderTurnTop();
    const team = game.teams[slot.team];
    setTag("react-team", slot.team, team.name);
    $("react-title").textContent = t("reactionTitle");
    $("react-count").textContent = game.slotLaughs;
    $("react-caption").textContent = t("laughs");
    $("react-mode").textContent = mic.ok ? t("reactionAuto") : t("reactionManual");
    $("btn-laugh").textContent = t("plusLaugh");
    $("btn-undo").textContent = t("undo");
    $("btn-react-end").textContent = t("endReaction");
    $("btn-undo").disabled = game.slotLaughs === 0;
    renderRing("react", game.phaseRemaining, REACTION_SECONDS * 1000);
  }

  function addLaugh() {
    if (game.phase !== "reaction") return;
    game.slotLaughs += 1;
    renderReaction();
    bump($("react-count"));
  }

  function undoLaugh() {
    if (game.phase !== "reaction" || game.slotLaughs === 0) return;
    game.slotLaughs -= 1;
    renderReaction();
  }

  function endSlot() {
    if (game.phase !== "reaction") return;
    clearInterval(game.timer);
    game.phaseRemaining = Math.max(0, game.phaseEnd - Date.now());
    const timedOut = game.phaseRemaining === 0;
    game.phase = null;

    const slot = currentSlot();
    game.teams[slot.team].players[slot.player].laughs += game.slotLaughs;
    game.slotResults.push({ team: slot.team, player: slot.player, laughs: game.slotLaughs });

    if (timedOut) {
      try { navigator.vibrate([200, 100, 200]); } catch (_) {}
    }
    renderDone(timedOut);
    panel("turn-done");
  }

  function renderDone(timedOut) {
    const slot = currentSlot();
    const team = game.teams[slot.team];
    setTag("done-team", slot.team, team.name);
    $("done-name").textContent = team.players[slot.player].name;
    $("done-count").textContent = game.slotLaughs;
    $("done-caption").textContent = t("laughs");
    $("done-note").textContent = timedOut ? t("timeUp") : t("stopped");
    if (game.slotIndex === game.order.length - 1) {
      $("btn-slot-next").textContent = t("seeRoundEnd");
    } else {
      const next = game.order[game.slotIndex + 1];
      $("btn-slot-next").textContent = t("nextUp", { name: game.teams[next.team].players[next.player].name });
    }
  }

  function slotNext() {
    game.slotIndex += 1;
    if (game.slotIndex < game.order.length) showReady();
    else showRoundResults();
  }

  function showRoundResults() {
    const totals = [0, 0];
    for (const r of game.slotResults) totals[r.team] += r.laughs;

    const [a, b] = game.teams;
    if (!game.awarded) {
      game.awarded = true;
      if (totals[0] > totals[1]) a.wins += 1;
      else if (totals[1] > totals[0]) b.wins += 1;
    }
    const winner = totals[0] === totals[1] ? null : (totals[0] > totals[1] ? a : b);

    $("res-title").textContent = t("roundOver", { n: game.round });
    $("res-premise").textContent = game.premise;
    $("scores").replaceChildren(...game.teams.map((team, i) =>
      h("div", { class: "score-box" },
        h("div", { class: "score-name" }, team.name),
        h("div", { class: "slot-count" }, totals[i]),
        h("div", { class: "caption" }, t("roundLaughsCaption"))
      )
    ));
    $("verdict").textContent = winner ? t("roundWinner", { team: winner.name }) : t("tie");
    $("res-summary").textContent = t("totalScore", { a: a.wins, b: b.wins });
    $("btn-next").textContent = t(game.round < game.totalRounds ? "nextRound" : "seePodium");
    show("s-results");
  }

  function showPodium() {
    const [a, b] = game.teams;
    const everyone = game.teams.flatMap((team) =>
      team.players.map((p) => ({ name: p.name, laughs: p.laughs, team: team.name }))
    );
    everyone.sort((x, y) => y.laughs - x.laughs || x.name.localeCompare(y.name, lang === "ro" ? "ro" : "en-GB"));

    const top = everyone.slice(0, 3);
    const places = [[2, top[1]], [1, top[0]], [3, top[2]]].filter(([, p]) => p);
    const heights = { 1: 200, 2: 140, 3: 100 };

    $("stage").replaceChildren(...places.map(([rank, p]) =>
      h("div", { class: "step" },
        h("div", { class: "step-name" }, p.name),
        h("div", { class: "step-team" }, p.team),
        h("div", { class: "step-score" }, laughsText(p.laughs)),
        h("div", { class: "block r" + rank, style: `height:${heights[rank]}px` }, String(rank))
      )
    ));

    let summary = a.wins === b.wins
      ? `${t("finalScore", { a: a.wins, b: b.wins })} ${t("tiedTeams")}`
      : `${t("finalScore", { a: a.wins, b: b.wins })} ${t("wonGame", { team: (a.wins > b.wins ? a : b).name })}`;
    if (everyone[0] && everyone[0].laughs === 0) summary += " " + t("noLaughs");
    $("final-summary").textContent = summary;

    $("roster").replaceChildren(...everyone.map((p) =>
      h("li", {},
        h("div", {},
          h("strong", {}, p.name),
          h("div", { class: "step-team" }, p.team)
        ),
        h("span", { class: "roster-score" }, laughsText(p.laughs))
      )
    ));

    show("s-podium");
  }

  /* ---------- Wiring ---------- */

  document.querySelectorAll(".lang-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      lang = btn.dataset.lang;
      applyStatic();
    });
  });

  $("btn-start").addEventListener("click", () => show("s-category"));
  $("btn-cat-back").addEventListener("click", () => show("s-intro"));

  document.querySelectorAll(".cat").forEach((btn) => {
    btn.addEventListener("click", () => {
      game.category = btn.dataset.cat;
      resetWizard();
      show("s-setup");
    });
  });

  $("btn-round-start").addEventListener("click", () => (game.mode === "free" ? nextFree() : showReady()));
  $("btn-slot-start").addEventListener("click", startJoke);
  $("btn-joke-end").addEventListener("click", startReaction);
  $("btn-laugh").addEventListener("click", addLaugh);
  $("btn-undo").addEventListener("click", undoLaugh);
  $("btn-react-end").addEventListener("click", endSlot);
  $("btn-slot-next").addEventListener("click", slotNext);
  $("btn-next").addEventListener("click", () => {
    if (game.round < game.totalRounds) nextRound();
    else showPodium();
  });
  document.querySelectorAll(".mode-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      game.mode = btn.dataset.mode;
      document.querySelectorAll(".mode-btn").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
    });
  });

  $("btn-new").addEventListener("click", () => {
    stopMic();
    show("s-intro");
  });

  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input, select, textarea")) return;
    const roundVisible = !$("s-round").hidden;
    const turnVisible = !$("s-turn").hidden;
    if (!roundVisible && !turnVisible) return;

    const key = e.key.toLowerCase();
    if (key === "a" && game.phase === "reaction") addLaugh();
    else if (key === "backspace" && game.phase === "reaction") { e.preventDefault(); undoLaugh(); }
    else if (key === " " && e.target.tagName !== "BUTTON") {
      e.preventDefault();
      if (roundVisible) (game.mode === "free" ? nextFree() : showReady());
      else if (game.phase === "joke") startReaction();
      else if (game.phase === "reaction") endSlot();
      else if (!$("turn-ready").hidden) startJoke();
      else if (!$("turn-done").hidden) slotNext();
    }
  });

  applyStatic();
  show("s-intro");
</script>
</body>
</html>
